[project]
name = "spec-decode-advisor"
version = "0.1.0"
description = "Tells you whether speculative decoding will pay off on your workload, and at what draft depth"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mlx-lm>=0.31.3",
    "numpy>=2.5.2",
]

[project.scripts]
spec-decode-advisor = "spec_decode_advisor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spec_decode_advisor"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
